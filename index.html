<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>띠부도감 1025 | 포켓몬 띠부씰 컬렉션</title>

  <meta name="google-site-verification" content="YKVXfxP0Ar2uMVWb4dmGCr_gHu4z3L2rFzlD9xc024A" />

  <meta name="description" content="포켓몬 띠부씰 1025종의 보유 및 구하는 목록을 확인할 수 있는 띠부도감입니다.">

  <link rel="stylesheet" href="style.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script defer src="app.js?v=5"></script>
</head>

<body>

<header class="top">
  <div class="wrap nav">

    <div class="brand">
      띠부도감 <span>1025</span>
    </div>

    <a class="admin-link" href="admin.html">
      관리자
    </a>

  </div>
</header>

<main class="wrap">

  <section class="hero">
    <div>

      <p class="eyebrow">
        POKÉMON STICKER COLLECTION
      </p>

      <h1>
        포켓몬 띠부씰을<br>
        <b>한눈에 확인하세요</b>
      </h1>

      <p class="sub">
        현재 보유 중인 띠부씰과 찾고 있는 띠부씰을 정리해 둔 띠부도감입니다.
      </p>

    </div>
  </section>

  <section class="stats">

    <div class="stat">
      <strong id="totalCount">1025</strong>
      <span>전체</span>
    </div>

    <div class="stat">
      <strong id="ownedCount">0</strong>
      <span>보유</span>
    </div>

    <div class="stat">
      <strong id="wantedCount">0</strong>
      <span>구하는 중</span>
    </div>

  </section>

  <section class="toolbar">

    <input
      id="search"
      placeholder="번호 또는 포켓몬 이름 검색"
    >

    <select id="status">
      <option value="all">전체</option>
      <option value="owned">보유</option>
      <option value="wanted">구하는 중</option>
    </select>

    <select id="formFilter">
      <option value="all">전체 폼</option>
    </select>

  </section>

  <section id="grid" class="grid"></section>

  <p id="empty" class="empty" hidden>
    등록된 띠부씰이 없습니다.
  </p>

</main>

<footer>
  띠부도감 1025
</footer>

</body>
</html>
