<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>관리자 - 띠부실 컬렉션</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script defer src="admin.js"></script>
</head>
<body>
<header class="top"><div class="wrap nav"><a class="brand" href="index.html">띠부실 <span>COLLECTION</span></a><button id="logout" class="ghost" hidden>로그아웃</button></div></header>
<main class="wrap admin">
<section id="loginBox" class="panel">
  <h1>관리자 로그인</h1><p>관리자 계정으로 로그인하면 띠부실 목록을 관리할 수 있습니다.</p>
  <input id="email" type="email" placeholder="관리자 이메일">
  <input id="password" type="password" placeholder="비밀번호">
  <button id="login" class="primary">로그인</button><p id="loginMsg" class="msg"></p>
</section>
<section id="manageBox" hidden>
  <div class="admin-head"><div><p class="eyebrow">ADMIN</p><h1>띠부실 관리</h1></div><button id="addBtn" class="primary">+ 띠부실 추가</button></div>
  <div class="panel">
    <input id="adminSearch" placeholder="번호 또는 이름 검색">
    <div class="table-wrap"><table><thead><tr><th>번호</th><th>이름</th><th>상태</th><th>메모</th><th></th></tr></thead><tbody id="rows"></tbody></table></div>
  </div>
</section>
<div id="modal" class="modal" hidden><div class="modal-card">
  <button id="closeModal" class="close">×</button><h2 id="modalTitle">띠부실 추가</h2>
  <label>번호<input id="formNo" type="number" min="1"></label>
  <label>포켓몬 이름<input id="formName" placeholder="예: 피카츄"></label>
  <label>상태<select id="formStatus"><option value="owned">보유</option><option value="wanted">구하는 중</option></select></label>
  <label>메모<textarea id="formNote" placeholder="교환 가능, 미개봉 등"></textarea></label>
  <button id="saveBtn" class="primary">저장</button><p id="formMsg" class="msg"></p>
</div></div>
</main>
</body>
</html>
